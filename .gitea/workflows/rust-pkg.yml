name: rust-pkg

# Reusable pipeline for Cargo-based packages under the `pkgs` org.
#   jobs:
#     pkg:
#       uses: pkgs/packaging/.gitea/workflows/rust-pkg.yml@main
#       with: { pkgname: my-package }
#       secrets: { PACKAGE_TOKEN: '${{ secrets.PACKAGE_TOKEN }}' }
#
# NOTE: each job does a cold `pacman -Syu` + `cargo install cargo-vet`. Once this
# is proven, bake a pkgs/ci image (see ~/runbooks/clockmost-packages.md) and set
# `image:` to it — cuts each run from minutes to seconds.

on:
  workflow_call:
    inputs:
      pkgname:
        required: true
        type: string
      rust_toolchain:
        required: false
        type: string
        default: stable
      extra_pacman_deps:
        required: false
        type: string
        default: ""
      cargo_features:
        description: >
          feature flags for fmt/clippy/build — e.g. "--all-features" or
          "--no-default-features --features foo,bar". Default: the crate's
          default features. Do NOT use --all-features on a crate that has
          mock/debug/dev features (they usually don't compile together).
        required: false
        type: string
        default: ""
      clippy_targets:
        description: 'clippy target scope — "--bins" (default, what ships) or "--all-targets"'
        required: false
        type: string
        default: "--bins"
    secrets:
      PACKAGE_TOKEN:
        required: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  scan:
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - name: toolchain + scanners
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            nodejs git rustup mold pkgconf sccache namcap \
            cargo-deny cargo-geiger python-pipx \
            trivy ${{ inputs.extra_pacman_deps }}
          rustup default ${{ inputs.rust_toolchain }}
          rustup component add clippy rustfmt
          pipx install semgrep

      - uses: actions/checkout@v4

      - uses: https://github.com/Swatinem/rust-cache@v2

      - name: install cargo-vet (cached by rust-cache)
        run: command -v cargo-vet || cargo install cargo-vet --locked

      - run: cargo fmt --all --check

      - run: cargo clippy --locked ${{ inputs.clippy_targets }} ${{ inputs.cargo_features }} -- -D warnings

      - name: cargo-deny (advisories + licenses + bans + sources)
        run: cargo deny check

      - name: cargo-vet
        run: |
          set -euo pipefail
          if [ ! -f supply-chain/audits.toml ]; then
            echo "::error::cargo-vet not initialised. Run 'cargo vet init' in the repo and commit supply-chain/ (see pkgs/packaging README)."
            exit 1
          fi
          if ! cargo vet --locked; then
            echo "::error::cargo-vet: unvetted dependencies — a Claude session triages these (pkgs/packaging README, 'cargo-vet failed')"
            cargo vet suggest || true
            exit 1
          fi

      - name: semgrep
        run: |
          ~/.local/bin/semgrep scan --error --metrics off \
            --config .semgrep.yml --config p/rust --config p/secrets --config p/security-audit .

      - run: cargo build --release --frozen ${{ inputs.cargo_features }}

      - name: trivy fs
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

      - name: cargo-geiger (report only)
        run: cargo geiger ${{ inputs.cargo_features }} --output-format GitHubMarkdown >> "$GITHUB_STEP_SUMMARY" || true

  package:
    needs: scan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - name: deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            nodejs git rustup mold namcap libarchive trivy ${{ inputs.extra_pacman_deps }}
          rustup default ${{ inputs.rust_toolchain }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: makepkg
        run: |
          set -euo pipefail
          useradd -m builder
          # let makepkg's git+ sources clone private pkgs/ repos via the internal endpoint
          git config --system url."http://gitea-server:3000/".insteadOf "https://git.clockmost.com/"
          printf 'machine gitea-server\n  login x-access-token\n  password %s\n' "${{ github.token }}" > /home/builder/.netrc
          chmod 600 /home/builder/.netrc && chown builder:builder /home/builder/.netrc
          chown -R builder:builder .
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg -f --noconfirm --needed --syncdeps --rmdeps

      - name: list built packages
        id: pkgs
        run: |
          set -euo pipefail
          # makepkg emits <name>-<ver>.pkg.tar.zst and, when the debug option is
          # on (Arch default), <name>-debug-<ver>.pkg.tar.zst too.
          shopt -s nullglob
          all=( ${{ inputs.pkgname }}-*.pkg.tar.zst )
          main=""
          for f in "${all[@]}"; do case "$f" in *-debug-*) ;; *) main="$f" ;; esac; done
          [ -n "$main" ] || { echo "::error::no package built"; exit 1; }
          echo "main=$main"       >> "$GITHUB_OUTPUT"
          echo "all=${all[*]}"    >> "$GITHUB_OUTPUT"
          printf '%s\n' "${all[@]}"

      - name: trivy rootfs (the shipped package)
        run: |
          set -euo pipefail
          mkdir _pkg
          bsdtar -C _pkg -xf "${{ steps.pkgs.outputs.main }}"
          trivy rootfs --severity HIGH,CRITICAL --exit-code 1 --no-progress _pkg

      - name: namcap (report only)
        run: namcap "${{ steps.pkgs.outputs.main }}" || true

      - name: publish to the clockmost Arch registry
        run: |
          set -euo pipefail
          [ -n "${{ secrets.PACKAGE_TOKEN }}" ] || { echo "::error::PACKAGE_TOKEN not passed"; exit 1; }
          for f in ${{ steps.pkgs.outputs.all }}; do
            code=$(curl -sS -o /dev/stderr -w '%{http_code}' \
              --user "publish:${{ secrets.PACKAGE_TOKEN }}" --upload-file "$f" \
              "${GITHUB_SERVER_URL}/api/packages/pkgs/arch/clockmost")
            case "$code" in
              200|201) echo "published $f" ;;
              409) echo "::error::$f already in the registry — bump pkgver/pkgrel"; exit 1 ;;
              *) echo "::error::upload failed: HTTP $code"; exit 1 ;;
            esac
          done

      - name: checksums
        run: b2sum ${{ steps.pkgs.outputs.all }} > b2sums.txt

      - uses: https://gitea.com/actions/release-action@main
        continue-on-error: true   # the package is already in the registry; the Gitea Release is a bonus
        with:
          files: |-
            *.pkg.tar.zst
            b2sums.txt
