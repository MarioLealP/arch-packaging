name: rust-pkg

# TEST VARIANT (cm-18n verification, 2026-11-19) — NOT the production patch.
# Differences from pkgs/packaging!cm-18n-target-cache:
#   * save-if is `always()` (production: main + v* tags only) so test-branch pushes
#     populate a same-ref cache that a later push can restore (Gitea Runner cache
#     scoping: a job only sees its own ref + the default branch).
#   * probes + the cache-evidence job encode cache hit / matched key / target size /
#     Compiling counts / toolchain parity into the evidence job's NAME — the run
#     pages are JS-only and job logs are not public.
#   * publish + Gitea release hard-disabled; callers pass no secrets.
#
# Reusable pipeline for Cargo-based packages under the `pkgs` org.
#
#   jobs:
#     pkg:
#       uses: pkgs/packaging/.gitea/workflows/rust-pkg.yml@<ref>
#       with: { pkgname: my-package }
#       secrets: { PACKAGE_TOKEN: '${{ secrets.PACKAGE_TOKEN }}' }
#
# Build caching (cm-18n): a persistent CARGO_TARGET_DIR cache (the checkout's
# `target/`, what the PKGBUILD template builds into) is restored and saved through
# the runner's built-in action cache. One key space per package:
# `pkgs-target-<pkgname>-<hash of **/Cargo.lock>` (exact) with the per-package
# `restore-keys` prefix fallback so a lockfile bump warm-starts from the newest
# entry. Saves land only where later runs can see them: `main` warms every ref
# (the default branch is readable from all cache scopes) and a `v*` tag's own save
# feeds the same run's package job (which runs after scan on the same ref). Entries
# live on the runner volume (`cache.dir: /data/actcache`), not the registry.

on:
  workflow_call:
    inputs:
      pkgname:
        description: pacman package name (matches PKGBUILD `pkgname`)
        required: true
        type: string
      rust_toolchain:
        description: 'rustup toolchain, e.g. "1.93.0" or "stable"'
        required: false
        type: string
        default: stable
      extra_pacman_deps:
        description: space-separated system libs the crate links at build time
        required: false
        type: string
        default: ""
      cargo_features:
        description: >-
          feature flags for clippy + build — e.g. "--all-features" or
          "--no-default-features --features foo,bar". Default: the crate's
          default features. Never --all-features on a crate with mock/dev
          features (they usually don't compile together).
        required: false
        type: string
        default: ""
      clippy_targets:
        description: 'clippy scope — "--bins" (default, what ships) or "--all-targets"'
        required: false
        type: string
        default: "--bins"
    secrets:
      PACKAGE_TOKEN:
        description: write:package token for the Arch registry (release only)
        required: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  scan:
    name: scan (lint · supply-chain · build)
    outputs:                      # TEST VARIANT — feeds the cache-evidence job
      tc_hit: ${{ steps.target-cache-du.outputs.hit }}
      tc_key: ${{ steps.target-cache-du.outputs.key }}
      tc_du: ${{ steps.target-cache-du.outputs.du }}
      tc_zst: ${{ steps.target-cache-du.outputs.zst }}
      tc_save: ${{ steps.target-save.outcome }}
      tc_comp: ${{ steps.build-probe.outputs.comp }}
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - name: Install toolchain + scanners
        run: |
          set -euo pipefail
          echo "::group::pacman -Syu"
          pacman -Syu --noconfirm --needed \
            nodejs git rustup mold pkgconf sccache namcap \
            cargo-deny cargo-geiger python-pipx python-filelock \
            trivy ${{ inputs.extra_pacman_deps }}
          # python-filelock: Arch's pipx imports it but doesn't depend on it (2026-10-25: every scan died at
          # "pipx install semgrep" with ModuleNotFoundError: filelock)
          echo "::endgroup::"
          echo "::group::rustup ${{ inputs.rust_toolchain }} + components"
          rustup default ${{ inputs.rust_toolchain }}
          rustup component add clippy rustfmt
          echo "::endgroup::"
          echo "::group::pipx install semgrep"
          pipx install semgrep
          echo "::endgroup::"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cargo registry + tool cache
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          # registry + ~/.cargo/bin only; `target/` is cached separately below so one
          # mechanism owns it and the lockfile-hash key can roll over to a fallback.
          cache-targets: false
          # only builds of main save a cache entry; pull requests and tags only read one. Every save is ~770 MB on the
          # runner's disk and a Renovate batch made 12 of them in 90 minutes (cm-kx8h, 2026-11-17).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Restore persistent target cache
        id: target-cache
        uses: actions/cache/restore@v4
        continue-on-error: true   # cache plumbing must never fail a build
        with:
          path: target
          key: pkgs-target-${{ inputs.pkgname }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            pkgs-target-${{ inputs.pkgname }}-

      - name: Install cargo-vet + cargo-machete (cached)
        run: |
          set -euo pipefail
          command -v cargo-vet     || cargo install cargo-vet --locked
          command -v cargo-machete || cargo install cargo-machete --locked

      # ---- lint -------------------------------------------------------------
      - name: rustfmt — formatting
        run: cargo fmt --all --check

      - name: clippy — lints (-D warnings)
        run: cargo clippy --locked ${{ inputs.clippy_targets }} ${{ inputs.cargo_features }} -- -D warnings

      - name: cargo-machete — unused dependencies
        run: cargo machete --with-metadata

      # ---- supply chain ---------------------------------------------------
      - name: cargo-deny — advisories · licenses · bans · source allow-list
        run: cargo deny check

      - name: cargo-vet — every dependency vetted or exempted
        run: |
          set -euo pipefail
          if [ ! -f supply-chain/audits.toml ]; then
            echo "::error::cargo-vet not initialised — run 'cargo vet init' in the repo and commit supply-chain/ (pkgs/packaging README)"
            exit 1
          fi
          if ! cargo vet --locked; then
            echo "::error::cargo-vet: unvetted dependencies — a Claude session triages these (pkgs/packaging README, 'cargo-vet failed')"
            cargo vet suggest || true
            exit 1
          fi

      - name: semgrep — SAST (rust · secrets · security-audit · custom)
        run: |
          ~/.local/bin/semgrep scan --error --metrics off \
            --config .semgrep.yml --config p/rust --config p/secrets --config p/security-audit .

      # ---- build + fs scan ----------------------------------------------
      - name: cargo build --release
        id: build-probe            # TEST VARIANT — counts fresh compiles as the cache probe
        run: |
          set -euo pipefail
          cargo build --release --frozen ${{ inputs.cargo_features }} 2>&1 | tee build.out
          echo "comp=$(sed 's/\x1b\[[0-9;]*m//g' build.out | grep -cE '^[[:space:]]+Compiling ' || true)" >> "$GITHUB_OUTPUT"

      - name: trivy fs — vulns · secrets · misconfig in the tree
        run: trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

      - name: cargo-geiger — unsafe surface (report only)
        run: |
          {
            echo "### cargo-geiger — \`unsafe\` in the dependency tree"
            echo '```'
            cargo geiger ${{ inputs.cargo_features }} --output-format Ascii 2>&1 | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save persistent target cache
        id: target-save
        if: always()               # TEST VARIANT — production gates this to main + v* tags
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: target
          key: pkgs-target-${{ inputs.pkgname }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Target cache evidence (test)
        id: target-cache-du
        if: always()
        run: |
          echo "du=$(du -sh target 2>/dev/null | cut -f1)" >> "$GITHUB_OUTPUT"
          # what the cache entry costs on disk: the actions/cache entry is a zstd
          # tar of target/ — measure it (T5 probe, cm-18n)
          zst="?"
          if [ -d target ]; then
            tar -I zstd -cf cache-probe.tar.zst target 2>/dev/null && zst="$(du -m cache-probe.tar.zst | cut -f1)M" || zst="fail"
            rm -f cache-probe.tar.zst
          fi
          echo "zst=$zst" >> "$GITHUB_OUTPUT"
          case "${{ steps.target-cache.outputs.cache-hit }}" in
            true|True) echo "hit=1" >> "$GITHUB_OUTPUT" ;;
            *)         echo "hit=0" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ steps.target-cache.outputs.cache-matched-key }}" in
            pkgs-target-*) echo "key=matched" >> "$GITHUB_OUTPUT" ;;
            *)             echo "key=none"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Summary
        if: always()
        run: |
          echo "### scan — \`${{ inputs.pkgname }}\` @ ${GITHUB_SHA::8}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| gate | |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| rustfmt · clippy · cargo-machete | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| cargo-deny · cargo-vet · semgrep | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| cargo build --release · trivy fs | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: package (makepkg · scan · publish)
    needs: scan
    outputs:                      # TEST VARIANT — feeds the cache-evidence job
      tc_hit: ${{ steps.target-cache-du.outputs.hit }}
      tc_key: ${{ steps.target-cache-du.outputs.key }}
      tc_du: ${{ steps.target-cache-du.outputs.du }}
      tc_save: ${{ steps.target-save.outcome }}
      tc_comp: ${{ steps.pkg-probe.outputs.comp }}
      tc_tool: ${{ steps.pkg-probe.outputs.tool }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - name: Install toolchain + tools
        run: |
          set -euo pipefail
          echo "::group::pacman -Syu"
          pacman -Syu --noconfirm --needed \
            nodejs git rustup mold namcap libarchive trivy ${{ inputs.extra_pacman_deps }}
          echo "::endgroup::"
          rustup default ${{ inputs.rust_toolchain }}

      - name: Checkout (full history for pkgver/tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The makepkg build writes to the checkout's `target/` (PKGBUILD template:
      # CARGO_TARGET_DIR=target), so it rides the same persistent cache and the
      # same key space as the scan job: on a tag the scan job's save (same ref,
      # same commit -> same key) is an exact hit here.
      - name: Restore persistent target cache
        id: target-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: target
          key: pkgs-target-${{ inputs.pkgname }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            pkgs-target-${{ inputs.pkgname }}-

      - name: makepkg — build the package
        id: pkg-probe             # TEST VARIANT — Compiling count + builder toolchain hash
        run: |
          set -euo pipefail
          useradd -m builder
          # let makepkg's git+ sources clone private pkgs/ repos via the internal endpoint
          git config --system url."http://gitea-server:3000/".insteadOf "https://git.clockmost.com/"
          printf 'machine gitea-server\n  login x-access-token\n  password %s\n' "${{ github.token }}" > /home/builder/.netrc
          chmod 600 /home/builder/.netrc && chown builder:builder /home/builder/.netrc
          chown -R builder:builder .
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg -f --noconfirm --needed --syncdeps --rmdeps 2>&1 | tee makepkg.out
          echo "comp=$(sed 's/\x1b\[[0-9;]*m//g' makepkg.out | grep -cE '^[[:space:]]+Compiling ' || true)" >> "$GITHUB_OUTPUT"
          root_hash=$(rustc -vV | sed -n 's/^commit-hash: //p')
          bld_hash=$(sudo -u builder bash -c 'rustc -vV' | sed -n 's/^commit-hash: //p')
          if [ "$root_hash" = "$bld_hash" ] && [ -n "$root_hash" ]; then
            echo "tool=eq" >> "$GITHUB_OUTPUT"
          else
            echo "tool=ne" >> "$GITHUB_OUTPUT"
          fi

      - name: Save persistent target cache
        id: target-save
        if: always()               # TEST VARIANT
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: target
          key: pkgs-target-${{ inputs.pkgname }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Target cache evidence (test)
        id: target-cache-du
        if: always()
        run: |
          echo "du=$(du -sh target 2>/dev/null | cut -f1)" >> "$GITHUB_OUTPUT"
          case "${{ steps.target-cache.outputs.cache-hit }}" in
            true|True) echo "hit=1" >> "$GITHUB_OUTPUT" ;;
            *)         echo "hit=0" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ steps.target-cache.outputs.cache-matched-key }}" in
            pkgs-target-*) echo "key=matched" >> "$GITHUB_OUTPUT" ;;
            *)             echo "key=none"    >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Identify built packages
        id: pkgs
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=( ${{ inputs.pkgname }}-*.pkg.tar.zst )
          main=""
          for f in "${all[@]}"; do case "$f" in *-debug-*) ;; *) main="$f" ;; esac; done
          [ -n "$main" ] || { echo "::error::no package produced"; exit 1; }
          echo "main=$main"    >> "$GITHUB_OUTPUT"
          echo "all=${all[*]}" >> "$GITHUB_OUTPUT"
          printf '  %s\n' "${all[@]}"

      - name: trivy rootfs — scan the shipped package contents
        run: |
          set -euo pipefail
          mkdir _pkg
          bsdtar -C _pkg -xf "${{ steps.pkgs.outputs.main }}"
          trivy rootfs --severity HIGH,CRITICAL --exit-code 1 --no-progress _pkg

      - name: namcap — packaging lint (report only)
        run: namcap "${{ steps.pkgs.outputs.main }}" || true

      - name: Publish to the clockmost Arch registry
        if: ${{ false }}           # TEST VARIANT — test tags must never touch the registry
        run: |
          set -euo pipefail
          [ -n "${{ secrets.PACKAGE_TOKEN }}" ] || { echo "::error::PACKAGE_TOKEN not passed by the caller"; exit 1; }
          for f in ${{ steps.pkgs.outputs.all }}; do
            code=$(curl -sS -o /dev/stderr -w '%{http_code}' \
              --user "publish:${{ secrets.PACKAGE_TOKEN }}" --upload-file "$f" \
              "${GITHUB_SERVER_URL}/api/packages/pkgs/arch/clockmost")
            case "$code" in
              200|201) echo "published $f" ;;
              409) echo "::error::$f already in the registry — bump pkgver or pkgrel"; exit 1 ;;
              *)   echo "::error::upload of $f failed: HTTP $code"; exit 1 ;;
            esac
          done

      - name: Checksums
        run: b2sum ${{ steps.pkgs.outputs.all }} > b2sums.txt

      - name: Gitea release (bonus — the registry upload is the deliverable)
        if: ${{ false }}           # TEST VARIANT — no release objects for test tags
        uses: https://gitea.com/actions/release-action@main
        continue-on-error: true
        with:
          files: |-
            *.pkg.tar.zst
            b2sums.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### package — \`${{ inputs.pkgname }}\` ${GITHUB_REF_NAME}"
            echo ""
            echo "Built: \`${{ steps.pkgs.outputs.all }}\`"
            echo ""
            echo "Published to \`[clockmost]\` — clients get it on the next \`pacman -Syu\`."
          } >> "$GITHUB_STEP_SUMMARY"

  cache-evidence:
    # TEST VARIANT ONLY — the run-detail pages are JS-only, so this job encodes the
    # cache evidence (hit / matched key / target size / compiles / save / toolchain
    # parity) into its NAME, which the anonymous actions/tasks API reports back.
    name: 'cache-evidence scan=[${{ needs.scan.result }} hit:${{ needs.scan.outputs.tc_hit }} key:${{ needs.scan.outputs.tc_key }} du:${{ needs.scan.outputs.tc_du }} zst:${{ needs.scan.outputs.tc_zst }} comp:${{ needs.scan.outputs.tc_comp }} save:${{ needs.scan.outputs.tc_save }}] pkg=[${{ needs.package.result }} hit:${{ needs.package.outputs.tc_hit }} key:${{ needs.package.outputs.tc_key }} du:${{ needs.package.outputs.tc_du }} comp:${{ needs.package.outputs.tc_comp }} tool:${{ needs.package.outputs.tc_tool }} save:${{ needs.package.outputs.tc_save }}]'
    needs: [scan, package]
    if: always()
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - run: echo "evidence is in this job's name"
