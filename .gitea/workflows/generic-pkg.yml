name: generic-pkg

# Reusable pipeline for non-Cargo packages (scripts, prebuilt binaries, data).
#   jobs:
#     pkg:
#       uses: pkgs/packaging/.gitea/workflows/generic-pkg.yml@main
#       with: { pkgname: my-package }
#       secrets: { PACKAGE_TOKEN: '${{ secrets.PACKAGE_TOKEN }}' }

on:
  workflow_call:
    inputs:
      pkgname:
        required: true
        type: string
      extra_pacman_deps:
        required: false
        type: string
        default: ""
    secrets:
      PACKAGE_TOKEN:
        required: false

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: archlinux
    container:
      image: archlinux:base-devel
    steps:
      - name: deps
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            nodejs git namcap libarchive shellcheck trivy ${{ inputs.extra_pacman_deps }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: trivy fs (secrets, misconfig)
        run: trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 --no-progress .

      - name: shellcheck
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          f=(**/*.sh)
          [ ${#f[@]} -eq 0 ] || shellcheck "${f[@]}"

      - name: makepkg
        run: |
          set -euo pipefail
          useradd -m builder
          # let makepkg's git+ sources clone private pkgs/ repos via the internal endpoint
          git config --system url."http://gitea-server:3000/".insteadOf "https://git.clockmost.com/"
          printf 'machine gitea-server\n  login x-access-token\n  password %s\n' "${{ github.token }}" > /home/builder/.netrc
          chmod 600 /home/builder/.netrc && chown builder:builder /home/builder/.netrc
          chown -R builder:builder .
          sudo -u builder git config --global --add safe.directory '*'
          sudo -u builder makepkg -f --noconfirm --needed --syncdeps --rmdeps

      - name: trivy rootfs (built package)
        run: |
          set -euo pipefail
          mkdir _pkg
          bsdtar -C _pkg -xf ${{ inputs.pkgname }}-*.pkg.tar.zst
          trivy rootfs --severity HIGH,CRITICAL --exit-code 1 --no-progress _pkg

      - name: namcap (report only)
        run: namcap ${{ inputs.pkgname }}-*.pkg.tar.zst || true

      - name: publish to the clockmost Arch registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          [ -n "${{ secrets.PACKAGE_TOKEN }}" ] || { echo "::error::PACKAGE_TOKEN not passed"; exit 1; }
          for f in ${{ inputs.pkgname }}-*.pkg.tar.zst; do
            code=$(curl -sS -o /dev/stderr -w '%{http_code}' \
              --user "publish:${{ secrets.PACKAGE_TOKEN }}" --upload-file "$f" \
              "${GITHUB_SERVER_URL}/api/packages/pkgs/arch/clockmost/x86_64")
            case "$code" in
              200|201) echo "published $f" ;;
              409) echo "::error::$f already in the registry — bump pkgver/pkgrel"; exit 1 ;;
              *) echo "::error::upload failed: HTTP $code"; exit 1 ;;
            esac
          done

      - name: checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: b2sum ${{ inputs.pkgname }}-*.pkg.tar.zst > b2sums.txt

      - uses: https://gitea.com/actions/release-action@main
        continue-on-error: true   # the package is already in the registry; the Gitea Release is a bonus
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |-
            *.pkg.tar.zst
            b2sums.txt
